<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>논문이 술술, PaperFlow</title>
  <style>
    :root { color-scheme:light; --ink:#171717; --muted:#737373; --line:#e5e5e5; --soft:#fafafa; --ok:#16794f; --bad:#b42318; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:#fff; font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } button { font:inherit; }
    header { width:min(1240px,calc(100% - 40px)); margin:auto; padding:28px 0; display:flex; justify-content:space-between; align-items:center; }
    .brand { display:flex; gap:10px; align-items:center; font-weight:800; letter-spacing:-.04em; } .logo { width:30px; height:30px; display:grid; place-items:center; color:#fff; background:var(--ink); border-radius:9px; }
    .badge,.muted { color:var(--muted); } .layout { width:min(1240px,calc(100% - 40px)); margin:34px auto 80px; display:grid; grid-template-columns:minmax(0,760px) 380px; gap:28px; align-items:start; }
    .intro { text-align:center; margin:0 0 28px; } h1 { margin:0 0 12px; font-size:clamp(28px,5vw,42px); letter-spacing:-.065em; } .intro p { margin:0; color:var(--muted); font-size:15px; line-height:1.7; }
    .card { border:1px solid var(--line); border-radius:22px; padding:26px; box-shadow:0 16px 45px rgba(0,0,0,.05); } .card + .card { margin-top:24px; }
    .dropzone { min-height:230px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px dashed #b8b8b8; border-radius:17px; background:var(--soft); text-align:center; transition:.2s; }
    .dropzone.dragover { border-color:var(--ink); background:#f1f1f1; transform:scale(1.01); } .upload-icon { width:48px; height:48px; display:grid; place-items:center; margin-bottom:16px; border-radius:14px; background:var(--ink); color:#fff; font-size:23px; }
    .dropzone strong { font-size:17px; } .dropzone p { margin:8px 0 18px; color:var(--muted); font-size:13px; } input[type=file] { display:none; }
    .secondary,.mini { cursor:pointer; border:1px solid var(--line); border-radius:9px; color:var(--ink); background:#fff; font-weight:700; } .secondary { padding:10px 16px; font-size:13px; } .mini { padding:6px 8px; font-size:11px; }
    .secondary:hover,.mini:hover { background:var(--soft); } .action { width:100%; cursor:pointer; margin-top:14px; border:0; border-radius:11px; padding:14px 18px; color:#fff; background:var(--ink); font-weight:800; } .action:disabled { cursor:not-allowed; color:#aaa; background:#e7e7e7; }
    .message { min-height:20px; margin:13px 0 0; color:var(--bad); text-align:center; font-size:13px; line-height:1.6; } .message.ok { color:var(--ok); }
    .progress { display:none; margin-top:24px; padding-top:22px; border-top:1px solid var(--line); } .progress.show { display:block; } .progress-title,.queue-head,.queue-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .progress-title { margin-bottom:12px; font-size:14px; font-weight:800; } .bar,.item-bar { border-radius:99px; background:#eee; overflow:hidden; } .bar { height:6px; } .bar div,.item-bar div { height:100%; background:var(--ink); transition:width .3s; }
    .queue-panel { position:sticky; top:22px; max-height:calc(100vh - 44px); display:flex; flex-direction:column; } .queue-head h2 { margin:0; font-size:18px; } .queue-summary { margin:12px 0; font-size:12px; color:var(--muted); } .queue-actions { display:flex; flex-wrap:wrap; gap:7px; }
    .queue-list { min-height:120px; margin-top:14px; overflow:auto; display:grid; gap:10px; } .empty { margin:auto; padding:26px; color:#aaa; text-align:center; font-size:13px; }
    .queue-item { border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; } .queue-item.active { border-color:#9db3ef; background:#f8faff; } .queue-item.failed { border-color:#efb5af; }
    .item-top { display:flex; justify-content:space-between; gap:10px; } .item-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:750; } .item-status { flex:none; color:var(--muted); font-size:11px; }
    .item-bar { height:3px; margin:9px 0; } .item-error { color:var(--bad); font-size:11px; line-height:1.4; } .item-tools { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .result { display:none; } .result.show { display:block; } .result-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; } .result-head h2 { margin:0; font-size:19px; }
    .translation { max-height:60vh; overflow:auto; font-size:15px; line-height:1.85; } .translation h3 { margin:24px 0 9px; font-size:16px; } .translation p { margin:0 0 14px; white-space:pre-wrap; } footer { padding:24px; color:#aaa; text-align:center; font-size:11px; }
    @media (max-width:960px) { .layout { grid-template-columns:1fr; } .queue-panel { position:static; max-height:none; order:2; } .queue-list { max-height:480px; } } @media (max-width:560px) { header,.layout { width:calc(100% - 24px); } .layout { margin-top:20px; } .badge { display:none; } .card { padding:16px; border-radius:18px; } }
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">P</div><span>논문이 술술, PaperFlow</span></div><div class="badge">English → 한국어</div></header>
  <div class="layout">
    <main>
      <section class="intro"><h1>논문을 자연스러운 한국어로</h1><p>여러 PDF를 등록하면 한 파일씩 OCR·번역하고<br />Pretendard가 적용된 PDF로 자동 저장합니다.</p></section>
      <section class="card upload-card">
        <div class="dropzone" id="dropzone"><div class="upload-icon">↑</div><strong>PDF 논문을 업로드하세요</strong><p>여러 파일 선택 가능 · 파일당 100MB · 최대 20개 / 500MB</p><label class="secondary" for="fileInput">파일 선택</label><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple /></div>
        <p class="message" id="message" aria-live="polite"></p><button class="action" id="startButton" disabled>순차 번역 시작</button>
        <div class="progress" id="progress" aria-live="polite"><div class="progress-title"><span id="progressLabel">준비 중</span><span id="progressPercent">0%</span></div><div class="bar"><div id="progressBar"></div></div></div>
      </section>
      <section class="card result" id="result"><div class="result-head"><h2 id="resultTitle">번역 결과</h2><button class="secondary" id="currentSave" type="button">PDF 저장</button></div><div class="translation" id="translation"></div></section>
    </main>
    <aside class="card queue-panel">
      <div class="queue-head"><h2>작업 목록</h2><span class="muted" id="queueCount">0/20</span></div><div class="queue-summary"><span id="queueSize">0 MB</span><span id="queueDone">완료 0</span></div>
      <div class="queue-actions"><button class="mini" id="pauseButton" disabled>일시정지</button><button class="mini" id="cancelButton" disabled>전체 취소</button><button class="mini" id="zipButton" disabled>전체 ZIP 저장</button><button class="mini" id="clearButton" disabled>목록 비우기</button></div>
      <div class="queue-list" id="queueList"><div class="empty">등록된 PDF가 없습니다.</div></div>
    </aside>
  </div>
  <footer>© 2026 박재윤. All rights reserved.</footer><script type="module" src="./assets/app.js"></script>
</body>
</html>
